<style>
/* Réplica do layout do ERP Kalunga (AdminLTE, skin preta): barra superior e menu #111, conteúdo #fafafa, caixas brancas com cabeçalho azul #2682bf */
:root{
  color-scheme:light;
  --shell:#111111; --menu-active:#1e282c; --menu-edge:#3c8dbc; --menu-sub:#303030; --menu-fg:#ffffff; --menu-muted:#b8c7ce;
  --page:#fafafa; --box:#ffffff; --border:#d6d6d6; --input:#d2d6de;
  --head:#2682bf; --green:#00a65a; --tag:#ffc000; --badge:#4e4d4c;
  --text:#333333; --text-2:#666666; --muted:#999999;
  --orange:#ff851b; --aqua:#00c0ef; --tgreen:#00a65a; --purple:#605ca8; --red:#dd4b39; --blue:#0073b7;
  --s-a:#2682bf; --s-p:#ff851b;
  --h1:#e3eff9; --h2:#b9d6ef; --h3:#7fb3e0; --h4:#3f8ccc; --h5:#2682bf; --h6:#175a8a;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:14px/1.42857 var(--font)}
a{color:inherit;text-decoration:none}
/* barra superior */
.main-header{position:sticky;top:0;z-index:30;height:50px;background:var(--shell);display:flex;align-items:center;color:#fff}
.logo{width:230px;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 16px;flex:none}
.logo img{height:31px;display:block}
.logo .fa{font-size:17px;color:#fff;margin-left:auto}
.notif{margin-left:auto;display:flex;align-items:center;gap:0;padding-right:8px}
.notif .it{position:relative;display:flex;align-items:center;gap:5px;padding:14px 6px 4px;font-weight:700;font-size:13px;white-space:nowrap}
.notif .sq{width:11px;height:11px;display:inline-block}
.notif .sq.r{background:#ff0000}.notif .sq.g{background:#2ecc40;border-radius:2px;position:relative}
.notif .sq.g::after{content:"\2713";position:absolute;inset:-3px 0 0 1px;font-size:10px;color:#fff;font-weight:700}
.notif .cnt{position:absolute;top:2px;left:50%;transform:translateX(-10%);background:var(--badge);color:#fff;font-size:10px;font-weight:700;line-height:1;padding:2px 6px;border-radius:9px;border:1px solid #777}
.lojas{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;padding:0 16px}
.lojas .fa{font-size:15px}
.user{display:flex;align-items:center;gap:10px;padding:0 14px}
.avatar{width:26px;height:26px;border-radius:50%;background:#f2d2a9;display:grid;place-items:center;color:#7a5530;font-size:15px}
.uname{font-size:14px;line-height:1.2;text-align:center}
.uname span{display:block;margin-top:3px;background:var(--tag);color:#111;font-size:9.5px;font-weight:700;padding:1px 4px;border:1px solid #c79500}
.gear{padding:0 18px 0 22px;font-size:15px}
/* menu lateral */
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 50px)}
.sidebar{background:var(--shell);color:var(--menu-fg)}
.sidebar ul{list-style:none;margin:0;padding:0}
.sidebar>ul>li>a{display:flex;align-items:center;padding:12px 15px 12px 22px;font-weight:700;font-size:14px;border-left:3px solid transparent}
.sidebar a .fa:first-child{width:16px;text-align:center;margin-right:4px;font-size:14px}
.sidebar a .fa-angle-double-right{margin-left:auto;font-size:13px}
.sidebar>ul>li.active>a{background:var(--menu-active);border-left-color:var(--menu-edge);padding-left:19px}
.sidebar .tree a{display:flex;align-items:center;padding:8px 15px 8px 25px;font-size:13px;font-weight:700;background:var(--menu-sub);margin:1px 0}
.sidebar .tree .tree a{padding-left:42px;font-weight:400;color:var(--menu-muted);background:#262626}
.sidebar .tree .tree a.on{color:#fff;font-weight:700}
/* conteúdo */
.content{padding:15px max(15px,env(safe-area-inset-right,0px)) 0 15px;min-width:0;display:flex;flex-direction:column;gap:15px}
.content-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 2px}
.content-header h1{margin:0;font-size:24px;font-weight:700;color:#333}
.bc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#444;padding-right:12px}
.bc .fa{color:#444;margin-right:4px}
.bc .sep{color:#999;margin:0 4px}
.bc .cur{color:#777}
.box{background:var(--box);border:1px solid var(--border);min-width:0}
.box-pad{padding:20px 24px}
.form-row{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.fg label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
.ig{display:flex}
.ig input,.ig select,select.fc{height:34px;border:1px solid var(--input);padding:6px 12px;font:14px var(--font);color:#555;background:#fff;border-radius:0}
.ig input{width:220px}
.ig .addon{width:40px;height:34px;border:1px solid var(--input);border-left:0;background:#fbfbfb;display:grid;place-items:center;color:#444}
select.fc{width:200px}
.btns{display:flex;gap:4px}
.btn{height:34px;border:1px solid #008d4c;background:var(--green);color:#fff;font:14px var(--font);padding:6px 14px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#008d4c}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--menu-edge);outline-offset:1px}
.periodo-info{font-size:12.5px;color:var(--text-2);margin-top:12px}
/* blocos */
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}
@media (max-width:1150px){.c7,.c5{grid-column:span 12}}
.bh{background:var(--head);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.bh .lg{display:flex;gap:12px;font-weight:400;font-size:12px}
.bh .lg i{display:inline-block;width:10px;height:10px;border:1px solid #fff;margin-right:5px;vertical-align:-1px}
.bb{padding:14px 16px;min-width:0}
.bn{font-size:12px;color:var(--text-2);padding:0 16px 12px}
/* tiles no padrão dos cards da Home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px 22px}
.tile{color:#fff;display:flex;flex-direction:column;min-height:105px}
.tile .cat{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:9px 10px 0;opacity:.95}
.tile .ttl{font-size:26px;font-weight:700;padding:2px 10px 0;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;font-weight:700;padding:2px 10px 8px;flex:1}
.tile .foot{background:rgba(0,0,0,.12);font-size:12.5px;font-weight:700;text-align:center;padding:5px 8px}
.tile .foot .fa{margin-right:5px}
.ins .sub{font-weight:400;font-size:13px;line-height:1.4}
.ins .ttl{font-size:16px;padding-top:4px}
.chart{position:relative;height:300px}.chart.tall{height:450px}
/* tabelas no padrão ERP */
.scroll{overflow-x:auto}
table.erp{width:100%;border-collapse:collapse;font-size:13px}
table.erp th{background:var(--head);color:#fff;font-weight:700;padding:9px 8px;text-align:center;border:1px solid var(--head);white-space:nowrap;font-size:12.5px}
table.erp td{border:1px solid var(--border);padding:8px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;color:#333}
table.erp td.l{text-align:left}
table.erp tr.tot td{background:var(--head);color:#fff;font-weight:700;border-color:var(--head)}
table.erp tbody tr:hover td{background:#f4f8fb}
table.erp tr.tot:hover td{background:var(--head)}
.heat td.h{min-width:62px;font-size:12px;border:2px solid #fff}
.lbl{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:1px;color:#fff}
.lbl.r{background:var(--red)}.lbl.g{background:#999}
.groups{display:flex;flex-direction:column;gap:12px}
.gr{display:grid;grid-template-columns:175px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13px}
.gr small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.gr .bar{height:16px;background:#eef1f4}
.gr .bar span{display:block;height:100%}
.gr .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.gr .n small{font-weight:400}
.cmp{display:flex;flex-direction:column;gap:9px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px}
.cr .l{display:flex;justify-content:flex-end}
.cr span.b{display:block;height:13px;min-width:2px}
.cr .l span.b{background:var(--s-a)}.cr .r span.b{background:var(--s-p)}
.cr .m{text-align:center;font-weight:700}
.cr .m small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{height:28px;border:1px solid var(--input);padding:4px 8px;font:13px var(--font);width:200px}
.tools label{font-weight:400;font-size:12.5px;display:flex;gap:5px;align-items:center;cursor:pointer}

.content{padding-bottom:70px}
.app{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;min-width:0}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eef2f6;color:#333;white-space:nowrap}

.bigbtn{display:flex;align-items:center;gap:12px;border:1px solid #d6dbe1;background:#fff;border-radius:8px;padding:14px 16px;font:15px var(--font);cursor:pointer;text-align:left;color:#222;width:100%}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

details.more{border-top:1px solid #eef0f2}

.tl2 li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13px}

.kv2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}

.f2{display:flex;flex-direction:column;gap:6px;font-size:14px}

.req{color:#dd4b39}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{border:1px solid #cfd5dc;border-radius:20px;background:#fff;padding:8px 14px;font:14px var(--font);cursor:pointer;color:#333}

.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;border:1px solid #e3e6ea;border-radius:6px;padding:8px 10px;cursor:pointer}
.fakefile{border:2px dashed #c4ccd5;border-radius:8px;padding:14px;text-align:center;font:14px var(--font);color:#667;cursor:pointer;background:#fff;width:100%}
.fakefile.ok{border-color:#00a65a;color:#00733e;background:#f1faf5}
.gbtn{border:0;border-radius:6px;background:#00a65a;color:#fff;font:700 15px var(--font);padding:12px 20px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.gbtn:hover{background:#008d4c}
.gbtn.blue{background:var(--head)}.gbtn.blue:hover{background:#1d6fa5}
.lbtn{border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#333;font:14px var(--font);padding:11px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.lbtn:hover{border-color:#9aa5b1}
.lbtn.sm{padding:5px 10px;font-size:12.5px}

.hint{background:#f2f8fd;border-radius:6px;padding:10px 12px;font-size:13.5px;color:#174b72;display:flex;gap:10px;align-items:flex-start}
.hint.green{background:#f1faf5;color:#00552e}.hint.red{background:#fdecea;color:#7c2014}.hint.amber{background:#fff4e0;color:#6e4600}

.err{background:#fdecea;color:#b0281a;border-radius:6px;padding:9px 12px;font-size:13.5px;font-weight:700}
.msgbox{background:#f8f9fb;border:1px solid #e3e6ea;border-radius:6px;padding:10px 12px;font:12.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#333}
.say-cli{background:#f1faf5;border:1px solid #bfe3cf;border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.5;color:#00442a}
.backlink{align-self:flex-start;border:0;background:none;color:var(--head);font:600 14px var(--font);cursor:pointer;padding:0;display:inline-flex;gap:6px;align-items:center}
.slabar{display:flex;flex-direction:column;gap:4px;min-width:150px}

.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.hist .meta{font-size:11.5px;color:#888;margin-bottom:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

.sbig{padding:18px 20px;display:flex;flex-direction:column;gap:10px}

.tests{display:flex;flex-wrap:wrap;gap:6px}
.tests button{border:1px solid #e0d39a;background:#fffbea;border-radius:6px;padding:5px 9px;font:12px var(--font);cursor:pointer;color:#4a3800;text-align:left;line-height:1.3}

.cvhead{padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}

/* análise */
.ana{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:330px;max-width:calc(100vw - 28px);background:#fff;border:1px solid #bbb;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:60;font-size:12.5px;border-radius:6px;overflow:hidden}

/* gaveta (C) */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none}

.ad-tb tr.sked td{background:#f6fafd}.ske-row td{padding:0 0 12px!important;background:#f6fafd}
.ske{border:1px solid #bcd7ee;border-radius:10px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:12px;white-space:normal}
.ske-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ske-h>div{display:flex;flex-direction:column;gap:2px}.ske-h b .fa{color:#2682bf}.ske-h .soft{font-size:12.5px}
.ske-vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}.ske-vars>span{color:#6b7280;margin-right:2px}
.skv{border:1px dashed #9cc3e4;background:#f2f8fd;color:#0b5c99;border-radius:14px;padding:3px 10px;font:600 12px var(--font);cursor:pointer}.skv:hover{background:#e3f0fb}
.ske-gs{display:grid;grid-template-columns:1fr;gap:10px}
.ske-g{display:flex;flex-direction:column;gap:6px;border:1px solid #eef0f2;border-radius:8px;padding:10px;min-width:0}.ske-g .lnk{align-self:flex-start;font-size:12.5px}
.ske-gt{font-weight:700;font-size:12.5px;color:#444;display:flex;gap:6px;align-items:center}.ske-gt .fa{color:#2682bf}
.ske-r{display:flex;gap:4px;align-items:center}.ske-r input{flex:1;min-width:0;height:32px;border:1px solid #d2d6de;border-radius:6px;padding:0 8px;font:13px var(--font)}
.ske-b{width:28px;height:28px;border:1px solid #dde3e8;background:#fff;border-radius:6px;color:#666;cursor:pointer;flex:none}.ske-b:disabled{opacity:.35;cursor:default}.ske-b.del:hover{color:#c0392b;border-color:#e8b4ad}
.ske-none{margin:0;font-size:12.5px}
.ske-pv{display:flex;flex-direction:column;gap:6px;border-top:1px dashed #dde3e8;padding-top:10px;font-size:12.5px}.ske-pv .skc{cursor:default}
.ske-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ske-f .soft{font-size:12px}

function stepperHTML(o){const st=o.steps,last=st.reduce((a,s,i)=>s[1]?i:a,-1),cancel=o.cancel;
 let right='';
 if(cancel)right=`<span class="dl red">Cancelado em <b>${cancel}</b></span>`;
 else if(o.entregue)right=o.deveria&&o.deveria!==o.entregue?`<span class="dl">Entregue em <b>${o.entregue}</b> · deveria chegar em <b class="r">${o.deveria}</b></span>`:`<span class="dl">Entregue em <b>${o.entregue}</b></span>`;
 else if(o.deveria)right=`<span class="dl">Deveria chegar em <b class="${o.atraso?'r':''}">${o.deveria}</b></span>`;
 else if(o.retirar)right=`<span class="dl">Retirar até <b class="r">${o.retirar}</b></span>`;
 return `<div class="stepper" style="--n:${st.length}">${st.map((s,i)=>`<div class="stp ${s[1]?'on':''} ${i<=last?'past':''} ${cancel&&i===last+1?'x':''}"><i class="c">${s[1]?'<i class="fa fa-check"></i>':cancel&&i===last+1?'<i class="fa fa-times"></i>':''}</i><b>${s[0]}</b><small>${s[1]||(cancel&&i===last+1?'cancelado':'')}</small></div>`).join('')}</div><div class="steprt">${right}</div>`}

function parseEmail(raw){const L=raw.replace(/\r/g,'').split('\n'),H=/^\s*(De|From)\s*:\s*(.*)$/i,msgs=[];let cur=null;
 for(let i=0;i<L.length;i++){const l=L[i],m=l.match(H);
  if(m&&L.slice(i+1,i+4).some(x=>/^\s*(Enviada em|Enviado em|Enviado|Sent|Data|Date|Para|To)\s*:/i.test(x))){cur={de:m[2].trim(),para:'',cc:'',quando:'',assunto:'',corpo:[]};msgs.push(cur);let j=i+1;
   for(;j<L.length;j++){const x=L[j];let mm;if(mm=x.match(/^\s*(Enviada em|Enviado em|Enviado|Sent|Data|Date)\s*:\s*(.*)$/i))cur.quando=mm[2].trim();else if(mm=x.match(/^\s*(Para|To)\s*:\s*(.*)$/i))cur.para=mm[2].trim();else if(mm=x.match(/^\s*(Cc)\s*:\s*(.*)$/i))cur.cc=mm[2].trim();else if(mm=x.match(/^\s*(Assunto|Subject)\s*:\s*(.*)$/i))cur.assunto=mm[2].trim();else break}
   i=j-1;continue}
  if(!cur){cur={de:'',para:'',cc:'',quando:'',assunto:'',corpo:[]};msgs.push(cur)}
  cur.corpo.push(l)}

function clean(h){const t=document.createElement('template');t.innerHTML=h;const OK={B:1,STRONG:1,I:1,EM:1,U:1,BR:1,UL:1,OL:1,LI:1,DIV:1,P:1,SPAN:1,FONT:1,MARK:1};
 (function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
  if(!OK[c.tagName]){walk(c);c.replaceWith(...c.childNodes);return}
  const dsk=c.getAttribute('data-sk'),dskl=c.hasAttribute('data-skl'),bg=c.style&&c.style.backgroundColor,fg=(c.style&&c.style.color)||c.getAttribute('color');[...c.attributes].forEach(a=>c.removeAttribute(a.name));
  if(c.tagName==='SPAN'||c.tagName==='FONT'){if(bg&&bg!=='transparent'&&!/rgba\([^)]*,\s*0\)/.test(bg))c.style.backgroundColor=bg;if(fg)c.style.color=fg}
  if(dsk&&c.tagName==='LI')c.setAttribute('data-sk',dsk);if(dskl&&(c.tagName==='UL'))c.setAttribute('data-skl','');
  walk(c)})})(t.content);return t.innerHTML}

 for(let di=0;di<ND;di++){const dt=new Date(TODAY.getTime()-(ND-1-di)*864e5),dow=dt.getDay();
  let n=Math.round((dow===0?12:dow===6?30:85)*(0.88+R()*0.24)*(1+di/ND*0.12));
  const spike=di>=ND-22&&di<=ND-15;if(spike)n=Math.round(n*1.35);

   const subs=AS[as].s.filter(x=>x[0]!=='Outro'),sw=subs.length?subs.map((x,i)=>[x,1/(i+1.3)]):[[['Outro','v'],1]];

 days.forEach((d,i)=>{const w=dDate(d).getDay();if(w===0||w===6)s+=`<rect x="${X(i)-iw/(days.length-1||1)/2}" y="${pt}" width="${iw/(days.length-1||1)}" height="${ih}" class="wk"/>`});
 s+=`<path d="${path(res)}" fill="none" stroke="${c1}" stroke-width="2" stroke-linejoin="round"/><path d="${path(rem)}" fill="none" stroke="${c2}" stroke-width="2" stroke-linejoin="round"/>`;
 const li=days.length-1,ly1=Y(res[li]),ly2=Y(rem[li]),sep=Math.abs(ly1-ly2)<16?(ly1<ly2?-8:8):0;
 if(!nar)s+=`<text x="${X(li)+8}" y="${ly1+4+sep}" class="dlab">Resolvidos</text><text x="${X(li)+8}" y="${ly2+4-sep}" class="dlab">Remetidos</text>`;
 s+=`<line id="xh" y1="${pt}" y2="${pt+ih}" class="xh" style="display:none"/><circle id="xh1" r="4" fill="${c1}" class="xd" style="display:none"/><circle id="xh2" r="4" fill="${c2}" class="xd" style="display:none"/><rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent" id="xov" tabindex="0" aria-label="Passe o mouse ou use as setas para ver cada dia"/></svg>`;
 box.innerHTML=`<div class="dleg"><span><i style="background:${c1}"></i>Resolvidos no atendimento</span><span><i style="background:${c2}"></i>Remetidos ao Pós-Venda</span></div>`+s;
 const ov=$('xov'),xh=$('xh'),d1=$('xh1'),d2=$('xh2');let ci=li;
 const show=(i,cx,cy)=>{ci=i;[xh,d1,d2].forEach(e=>e.style.display='');xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));d1.setAttribute('cx',X(i));d1.setAttribute('cy',Y(res[i]));d2.setAttribute('cx',X(i));d2.setAttribute('cy',Y(rem[i]));
  tipShow(cx,cy,dDate(days[i]).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}),[[c1,'resolvidos no atendimento',nf(res[i])],[c2,'remetidos ao Pós-Venda',nf(rem[i])],['','no total',nf(res[i]+rem[i])]])};
 const idx=e=>{const r=ov.getBoundingClientRect(),sx=W/box.querySelector('svg').getBoundingClientRect().width;return Math.max(0,Math.min(li,Math.round(((e.clientX-r.left)*sx)/(iw/(li||1)))))};
 ov.addEventListener('pointermove',e=>show(idx(e),e.clientX,e.clientY));ov.addEventListener('pointerleave',()=>{[xh,d1,d2].forEach(e=>e.style.display='none');tipHide()});
 ov.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const i=Math.max(0,Math.min(li,ci+(e.key==='ArrowRight'?1:-1)));const r=ov.getBoundingClientRect();show(i,r.left+r.width*i/(li||1),r.top)}});
 ov.addEventListener('blur',()=>{[xh,d1,d2].forEach(e=>e.style.display='none');tipHide()})}

/* ---------- barras horizontais (HTML) ---------- */
function hbars(box,items,o){o=o||{};const mx=Math.max(...items.map(x=>x.v),o.ref||0,1);
 box.innerHTML=`<div class="hb">${items.map((x,i)=>`<div class="hb-r${x.other?' oth':''}${o.click&&!x.other?' clk':''}" tabindex="0" data-hb="${i}"><span class="hb-l" title="${esc(x.label)}">${esc(x.label)}</span><span class="hb-t"><span class="hb-b" style="width:${(x.v/mx*100).toFixed(2)}%"></span>${o.ref?`<span class="hb-ref" style="left:${(o.ref/mx*100).toFixed(2)}%"></span>`:''}</span><span class="hb-v">${o.fmt?o.fmt(x.v):nf(x.v)}${x.s?` <small>${x.s}</small>`:''}</span></div>`).join('')}</div>${o.ref?`<div class="hb-note"><span class="hb-refk"></span> ${o.refLbl}</div>`:''}`;
 box.querySelectorAll('[data-hb]').forEach(el=>{const x=items[+el.dataset.hb];hov(el,()=>[x.label,x.tip||[['',x.s||'',o.fmt?o.fmt(x.v):nf(x.v)]]]);if(o.click&&!x.other){el.onclick=()=>o.click(x);el.onkeydown=e=>{if(e.key==='Enter')o.click(x)}}})}
function drawAs(cur,prev){const box=$('db-as'),key=DQ.as?'sub':'as',g=grp(cur,key),gp=grp(prev,key),n=cur.length||1;
 let it=[...g].map(([k,r])=>({label:k,v:r.length,s:pf(r.length/n),p:(gp.get(k)||[]).length})).sort((a,b)=>b.v-a.v);
 if(DQ.tbl.as){box.innerHTML=tblHTML([DQ.as?'Tópico':'Assunto','Protocolos','% do total','Período anterior','Variação'],it.map(x=>[esc(x.label),nf(x.v),x.s,nf(x.p),x.p?((x.v>=x.p?'+':'−')+pf(Math.abs(x.v/x.p-1))):'—']));return}
 const top=it.slice(0,10),rest=it.slice(10);if(rest.length)top.push({label:`Demais ${rest.length} ${DQ.as?'tópicos':'assuntos'}`,v:rest.reduce((a,x)=>a+x.v,0),s:pf(rest.reduce((a,x)=>a+x.v,0)/n),other:true});
 top.forEach(x=>x.tip=[['','protocolos no período',nf(x.v)],['','do total',x.s],...(x.other?[]:[['','no período anterior',nf(x.p)]])]);
 hbars(box,top,{click:DQ.as?null:x=>{DQ.as=x.label;renderDash()}})}
function drawTas(cur,K){const box=$('db-tas'),g=grp(cur,DQ.as?'sub':'as');
 let it=[...g].filter(([k,r])=>r.length>=(DQ.per<=7?3:8)).map(([k,r])=>({label:k,v:r.reduce((a,x)=>a+x.t,0)/r.length,n:r.length})).sort((a,b)=>b.v-a.v);
 if(DQ.tbl.tas){box.innerHTML=tblHTML([DQ.as?'Tópico':'Assunto','Tempo médio','Protocolos','vs. média geral'],it.map(x=>[esc(x.label),tf(x.v),nf(x.n),(x.v>=K.t?'+':'−')+pf(Math.abs(x.v/K.t-1))]));return}
 it=it.slice(0,10);it.forEach(x=>x.tip=[['','tempo médio para registrar',tf(x.v)],['','protocolos',nf(x.n)],['','média geral',tf(K.t)]]);
 if(!it.length){box.innerHTML='<p class="soft">Poucos protocolos para comparar.</p>';return}
 hbars(box,it,{fmt:tf,ref:K.t,refLbl:`média geral: ${tf(K.t)}`})}

/* ---------- 4. atendentes ---------- */
function drawAt(cur){const box=$('db-at'),g=grp(cur,'at');
 let it=[...g].map(([a,r])=>({a,n:r.length,t:r.reduce((s,x)=>s+x.t,0)/r.length,rem:r.filter(x=>x.rem).length/r.length,out:r.filter(x=>isOutAs(x.as)||x.sub==='Outro').length/r.length,live:r.some(x=>x.live)}));
 const [k,dir]=DQ.sort;it.sort((x,y)=>(k==='a'?x.a.localeCompare(y.a):x[k]-y[k])*dir);
 const mxN=Math.max(...it.map(x=>x.n),1),mxT=Math.max(...it.map(x=>x.t),1),avgT=cur.length?cur.reduce((s,x)=>s+x.t,0)/cur.length:0;
 const th=(key,l)=>`<th><button type="button" data-sort="${key}" aria-sort="${k===key?(dir>0?'ascending':'descending'):'none'}">${l}${k===key?` <i class="fa fa-caret-${dir>0?'up':'down'}"></i>`:''}</button></th>`;
 box.innerHTML=`<div class="scroll"><table class="tb dat"><thead><tr>${th('a','Atendente')}${th('n','Protocolos')}${th('t','Tempo médio para registrar')}${th('rem','% remetidos')}${th('out','% "Outros"')}</tr></thead><tbody>${it.map(x=>`<tr${x.live?' class="me"':''}><td><b>${esc(x.a)}</b>${x.live?' <span class="pill blue" style="font-size:10.5px">esta sessão</span>':''}</td>
  <td><span class="ib"><span style="width:${(x.n/mxN*100).toFixed(1)}%"></span></span><span class="num">${nf(x.n)}</span></td>
  <td><span class="ib t"><span style="width:${(x.t/mxT*100).toFixed(1)}%"></span></span><span class="num">${tf(x.t)}</span>${x.t>avgT*1.15?' <span class="flag" title="acima de 15% da média"><i class="fa fa-exclamation-triangle"></i> acima da média</span>':''}</td>
  <td class="num">${pf(x.rem)}</td><td class="num">${pf(x.out,1)}</td></tr>`).join('')}</tbody></table></div><p class="dnote">Média geral para registrar: <b>${tf(avgT)}</b>. Clique no título da coluna para ordenar.</p>`;
 box.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const kk=b.dataset.sort;DQ.sort=[kk,DQ.sort[0]===kk?-DQ.sort[1]:(kk==='a'?1:-1)];drawAt(cur)})}

/* ---------- 5. pós-venda: distribuição em dias ---------- */
function drawPv(cur){const box=$('db-pv'),done=cur.filter(x=>x.pv!==null),B=[[0,1,'até 1'],[1,2,'1–2'],[2,3,'2–3'],[3,5,'3–5'],[5,7,'5–7'],[7,10,'7–10'],[10,15,'10–15'],[15,1e9,'15+']];
 const it=B.map(([a,b,l])=>({l,v:done.filter(x=>x.pv>a&&x.pv<=b||(a===0&&x.pv===0)).length,late:a>=7}));const n=done.length||1;
 if(DQ.tbl.pv){box.innerHTML=tblHTML(['Dias até concluir','Protocolos','%','Prazo'],it.map(x=>[x.l+' dias',nf(x.v),pf(x.v/n),x.late?'fora do prazo':'dentro do prazo']));return}
 const mx=Math.max(...it.map(x=>x.v),1);
 box.innerHTML=`<div class="vb">${it.map((x,i)=>`<div class="vb-c${x.late?' late':''}" tabindex="0" data-vb="${i}"><span class="vb-v">${nf(x.v)}</span><span class="vb-t"><span class="vb-b" style="height:${(x.v/mx*100).toFixed(1)}%"></span></span><span class="vb-l">${x.l}</span></div>${i===4?'<div class="vb-mk"><span>7 dias</span></div>':''}`).join('')}</div>
  <div class="dleg"><span><i class="k1"></i>Dentro do prazo</span><span><i class="kl"></i><b class="st-bad"><i class="fa fa-exclamation-triangle"></i></b> Fora do prazo (mais de 7 dias)</span></div>`;
 box.querySelectorAll('[data-vb]').forEach(el=>{const x=it[+el.dataset.vb];hov(el,()=>[x.l+' dias',[['','protocolos',nf(x.v)],['','do total concluído',pf(x.v/n)],['',x.late?'fora do prazo':'dentro do prazo','']]])})}

/* ---------- 6. canais ---------- */
function drawCa(cur){const box=$('db-ca'),g=grp(cur,'canal'),n=cur.length||1,it=[...g].map(([c,r])=>({label:c,v:r.length,s:pf(r.length/n),rem:r.filter(x=>x.rem).length/r.length})).sort((a,b)=>b.v-a.v);
 if(DQ.tbl.ca){box.innerHTML=tblHTML(['Canal','Protocolos','% do total','% remetidos'],it.map(x=>[esc(x.label),nf(x.v),x.s,pf(x.rem)]));return}
 it.forEach(x=>x.tip=[['','protocolos',nf(x.v)],['','do total',x.s],['','remetidos ao Pós-Venda',pf(x.rem)]]);
 hbars(box,it,{click:x=>{DQ.canal=x.label;renderDash()}})}

/* ---------- 7. heatmap dia × hora ---------- */
function drawHm(cur){const box=$('db-hm'),dn=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],ord=[1,2,3,4,5,6,0],hs=DHR.map((_,i)=>8+i),M={};
 cur.forEach(x=>{const k=x.dow+'|'+x.h;M[k]=(M[k]||0)+1});const mx=Math.max(1,...Object.values(M));
 if(DQ.tbl.hm){box.innerHTML=tblHTML(['Dia',...hs.map(h=>h+'h')],ord.map(d=>[dn[d],...hs.map(h=>nf(M[d+'|'+h]||0))]));return}
 box.innerHTML=`<div class="hm" style="--hc:${hs.length}"><span></span>${hs.map(h=>`<span class="hm-x">${h}h</span>`).join('')}${ord.map(d=>`<span class="hm-y">${dn[d]}</span>${hs.map(h=>{const v=M[d+'|'+h]||0;return `<span class="hm-c" tabindex="0" data-hm="${d}|${h}" style="--a:${(0.06+0.94*v/mx).toFixed(3)}"></span>`}).join('')}`).join('')}</div>
  <div class="hm-leg"><span>menos</span><span class="hm-sc"></span><span>mais (${nf(mx)} num horário)</span></div>`;
 box.querySelectorAll('[data-hm]').forEach(el=>{const [d,h]=el.dataset.hm.split('|');hov(el,()=>[`${dn[d]}, ${h}h às ${+h+1}h`,[['','protocolos',nf(M[el.dataset.hm]||0)]]])})}

function bindDash(cur){
 app.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{DQ.per=+b.dataset.per;renderDash()});
 $('dfas').onchange=e=>{DQ.as=e.target.value;renderDash()};$('dfca').onchange=e=>{DQ.canal=e.target.value;renderDash()};$('dfat').onchange=e=>{DQ.at=e.target.value;renderDash()};
 $('dclr')&&($('dclr').onclick=()=>{DQ.as=DQ.canal=DQ.at='';renderDash()});
 app.querySelectorAll('[data-tbl]').forEach(b=>b.onclick=()=>{const k=b.dataset.tbl;DQ.tbl[k]=!DQ.tbl[k];renderDash();$('dc-'+k)?.scrollIntoView({block:'nearest'})});
 app.querySelectorAll('[data-goadm]').forEach(b=>b.onclick=()=>go('adm'));
 $('dprint').onclick=()=>window.print();
 $('dcsv').onclick=()=>{const q=v=>`"${String(v).replace(/"/g,'""')}"`,head=['data','dia_semana','hora','assunto','topico','canal','atendente','tempo_registro_seg','remetido_pos_venda','remetido_novamente','dias_ate_concluir','em_aberto'];
  const L=[head.join(';'),...cur.map(r=>[dDate(r.di).toLocaleDateString('pt-BR'),['dom','seg','ter','qua','qui','sex','sáb'][r.dow],r.h+'h',r.as,r.sub,r.canal,r.at,r.t,r.rem?'sim':'não',r.re?'sim':'não',r.pv===null?'':String(r.pv).replace('.',','),r.open?'sim':'não'].map(q).join(';'))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=`sac-painel-${DQ.per}dias.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(`${nf(cur.length)} protocolos exportados`)}}
let _drz;addEventListener('resize',()=>{if(S.v!=='dash')return;clearTimeout(_drz);_drz=setTimeout(()=>{const y=scrollY;renderDash();scrollTo(0,y)},200)});
$('nav-dash').onclick=e=>{e.preventDefault();go('dash')};

render();

</script>
